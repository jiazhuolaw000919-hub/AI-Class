    <!-- Academy 启动脚本 (瘦身版)                                     -->
    <!-- ============================================================ -->
    <script>
        (function() {
            'use strict';

            console.log('📄 Academy page loaded (Part 164 - Slim)');

            var loader = window.LawAIApp?.AcademyLoader;
            if (!loader) {
                console.warn('[Academy] AcademyLoader not found');
                return;
            }

            // ============================================================
            // 导航点击
            // ============================================================
            document.querySelectorAll('.nav-item').forEach(function(item) {
                item.addEventListener('click', function(e) {
                    var tab = this.dataset.tab;

                    if (tab === 'home') {
                        window.location.href = '/';
                        return;
                    }
                    if (tab === 'academy') {
                        window.location.href = '/pages/academy.html';
                        return;
                    }

                    e.preventDefault();

                    var container = document.getElementById('academy-root');
                    if (!container) return;

                    if (tab === 'calendar') {
                        loader.renderCalendar(container, function() {
                            loader.updateNavHighlight('calendar');
                        });
                        return;
                    }

                    if (tab === 'settings') {
                        loader.renderSettings(container, function() {
                            loader.updateNavHighlight('settings');
                        });
                        return;
                    }

                    if (tab === 'notes') {
                        var event = new CustomEvent('NAVIGATE_TO_NOTES', {
                            detail: { source: 'bottom-nav' }
                        });
                        document.dispatchEvent(event);
                        return;
                    }
                });
            });

            // ============================================================
            // 事件监听器 (精简)
            // ============================================================

            // Calendar 导航
            document.addEventListener('NAVIGATE_TO_CALENDAR', function(e) {
                console.log('[Academy] 📅 NAVIGATE_TO_CALENDAR received');
                var container = document.getElementById('academy-root');
                if (container) {
                    loader.renderCalendar(container, function() {
                        loader.updateNavHighlight('calendar');
                    });
                }
            });

            // Settings 导航
            document.addEventListener('NAVIGATE_TO_SETTINGS', function(e) {
                console.log('[Academy] ⚙️ NAVIGATE_TO_SETTINGS received');
                var container = document.getElementById('academy-root');
                if (container) {
                    loader.renderSettings(container, function() {
                        loader.updateNavHighlight('settings');
                    });
                }
            });

                        // Notes 导航
            document.addEventListener('NAVIGATE_TO_NOTES', function(e) {
                console.log('[Academy] 📝 NAVIGATE_TO_NOTES received');
                var container = document.getElementById('academy-root');
                if (!container) return;

                container.innerHTML = `
                    <div style="text-align:center;padding:60px;color:#94a3b8;">
                        <div style="font-size:48px;margin-bottom:16px;animation:pulse 2s ease-in-out infinite;">📝</div>
                        <p>Loading Notes...</p>
                    </div>
                `;

                // 确保 NotesAuthority 就绪
                var proceed = function() {
                    // 确保 notes.js 加载
                    if (window.LawAIApp?.Notes) {
                        window.LawAIApp.Notes._root = container;
                        window.LawAIApp.Notes.render();
                        loader.updateNavHighlight('notes');
                        return;
                    }
                    // 动态加载 notes.js
                    var files = ['/js/academy/knowledgeEditor.js', '/js/notes.js'];
                    var loaded = 0;
                    files.forEach(function(file) {
                        var script = document.createElement('script');
                        script.src = file + '?v=' + Date.now();
                        script.onload = function() {
                            loaded++;
                            if (loaded === files.length && window.LawAIApp?.Notes) {
                                window.LawAIApp.Notes._root = container;
                                window.LawAIApp.Notes.render();
                                loader.updateNavHighlight('notes');
                            }
                        };
                        script.onerror = function() {
                            loaded++;
                            console.warn('[Academy] Failed to load:', file);
                        };
                        document.head.appendChild(script);
                    });
                };

                if (loader.loadNotesAuthority) {
                    loader.loadNotesAuthority(function() {
                        console.log('[Academy] ✅ NotesAuthority ready');
                        proceed();
                    }, function(error) {
                        console.warn('[Academy] ⚠️ NotesAuthority load failed:', error);
                        // 即使 Authority 失败，也尝试渲染（notes.js 会显示 loading 或 error）
                        proceed();
                    });
                } else {
                    proceed();
                }
            });

            // CalendarAuthority 预加载
            document.addEventListener('NAVIGATE_TO_CALENDAR_AUTHORITY', function(e) {
                console.log('[Academy] 📅 NAVIGATE_TO_CALENDAR_AUTHORITY received');
                if (loader.loadCalendarAuthority) {
                    loader.loadCalendarAuthority(function(auth) {
                        console.log('[Academy] ✅ CalendarAuthority ready:', auth.getStatusSummary());
                        if (window.LawAIApp?.Toast?.success) {
                            LawAIApp.Toast.success('📅 Calendar ready');
                        }
                    }, function(error) {
                        console.warn('[Academy] ⚠️ CalendarAuthority load failed:', error);
                    });
                }
            });

            // NotesAuthority 预加载
            document.addEventListener('NAVIGATE_TO_NOTES_AUTHORITY', function(e) {
                console.log('[Academy] 📝 NAVIGATE_TO_NOTES_AUTHORITY received');
                if (loader.loadNotesAuthority) {
                    loader.loadNotesAuthority(function(auth) {
                        console.log('[Academy] ✅ NotesAuthority ready:', auth.getStatusSummary());
                        if (window.LawAIApp?.Toast?.success) {
                            LawAIApp.Toast.success('📝 Notes ready');
                        }
                    }, function(error) {
                        console.warn('[Academy] ⚠️ NotesAuthority load failed:', error);
                    });
                }
            });

            // ============================================================
            // 🔥 初始化 Academy（支持 view=xxx URL 参数路由）
            // ============================================================
            function initAcademy() {
                var params = new URLSearchParams(window.location.search);
                var view = params.get('view');
                var container = document.getElementById('academy-root');

                console.log('[Academy] initAcademy, view =', view);

                if (!container) {
                    console.warn('[Academy] #academy-root not found');
                    return;
                }

                // ============================================================
                // 1. Calendar
                // ============================================================
                if (view === 'calendar') {
                    loader.renderCalendar(container);
                    return;
                }

                // ============================================================
                // 2. Settings
                // ============================================================
                if (view === 'settings') {
                    loader.renderSettings(container);
                    return;
                }

                if (view === 'notes') {
                    var notesEvent = new CustomEvent('NAVIGATE_TO_NOTES', {
                        detail: { source: 'url' }
                    });
                    document.dispatchEvent(notesEvent);
                    return;
                }

                // ============================================================
                // 3. Lesson → 用 LessonView 在页面内渲染（不跳转）
                // ============================================================
                if (view === 'lesson') {
                    var lessonId = params.get('lessonId') || params.get('id');
                    if (!lessonId) {
                        console.warn('[Academy] view=lesson 但没有 lessonId');
                        return;
                    }

                    console.log('[Academy] 📖 Render lesson in-page:', lessonId);

                    // 确保 AcademyExperienceManager 初始化
                    if (window.LawAIApp?.AcademyExperienceManager) {
                        if (!window.LawAIApp.AcademyExperienceManager.initialized) {
                            window.LawAIApp.AcademyExperienceManager.init();
                        }
                        window.LawAIApp.AcademyExperienceManager._state.currentLessonId = lessonId;
                        window.LawAIApp.AcademyExperienceManager._state.viewMode = 'lesson';
                    }

                    // 直接用 LessonView 渲染
                    var lessonView = window.LawAIApp?.Views?.LessonView || window.LawAIApp?.LessonView;
                    if (lessonView && typeof lessonView.render === 'function') {
                        lessonView.render(lessonId, container);
                    } else {
                        // LessonView 还没加载好，轮询等待
                        container.innerHTML = '<div style="padding:40px;text-align:center;color:#94a3b8;">⏳ Loading LessonView...</div>';
                        var retries = 0;
                        var retryInterval = setInterval(function() {
                            retries++;
                            var lv = window.LawAIApp?.Views?.LessonView || window.LawAIApp?.LessonView;
                            if (lv && typeof lv.render === 'function') {
                                clearInterval(retryInterval);
                                lv.render(lessonId, container);
                            } else if (retries > 20) {
                                clearInterval(retryInterval);
                                container.innerHTML = '<div style="padding:40px;text-align:center;color:#ef4444;">❌ LessonView 未加载，请刷新页面</div>';
                            }
                        }, 200);
                    }
                    return;
                }

                // ============================================================
                // 4. School / Course / Subject → 设置 state 并渲染
                // ============================================================
                if (window.LawAIApp?.AcademyExperienceManager) {
                    if (!window.LawAIApp.AcademyExperienceManager.initialized) {
                        window.LawAIApp.AcademyExperienceManager.init();
                    }

                    var manager = window.LawAIApp.AcademyExperienceManager;

                    if (view === 'school') {
                        var schoolId = params.get('schoolId');
                        if (schoolId) {
                            console.log('[Academy] 🏛️ Restore school view:', schoolId);
                            manager._state.currentSchoolId = schoolId;
                            manager._state.viewMode = 'school';
                            manager.render();
                            return;
                        }
                    }

                    if (view === 'course') {
                        var courseId = params.get('courseId');
                        if (courseId) {
                            console.log('[Academy] 📚 Restore course view:', courseId);
                            manager._state.currentCourseId = courseId;
                            manager._state.viewMode = 'course';
                            manager.render();
                            return;
                        }
                    }

                    if (view === 'subject') {
                        var subjectId = params.get('subjectId');
                        if (subjectId) {
                            console.log('[Academy] 📖 Restore subject view:', subjectId);
                            manager._state.currentSubjectId = subjectId;
                            manager._state.viewMode = 'subject';
                            manager.render();
                            return;
                        }
                    }

                    // 默认：Dashboard
                    console.log('[Academy] 🏠 Default: dashboard');
                    manager.render();
                } else {
                    console.warn('[Academy] AcademyExperienceManager not available');
                }
            }

            if (document.readyState === 'complete') {
                setTimeout(initAcademy, 200);
            } else {
                window.addEventListener('load', function() { setTimeout(initAcademy, 200); });
            }

            console.log('✅ Academy page ready (Part 164 - Slim)');

        })();
    </script>

    <!-- ============================================================ -->
    <!-- Part 174: 内置数据 Bootstrap — 已废弃 (v2.1.0)                -->
    <!-- ============================================================ -->
    <!--
        ⚠️ 这一段之前硬编码注册了假数据：
          - course:  course-ai-fundamentals
          - subject: subject-what-is-ai
          - lessons: lesson-ai-intro / lesson-ai-history（对象格式）
        
        直接往 CourseRegistry._courses (Map) 和 SubjectRegistry 塞数据，
        绕过了所有 register() 校验，导致 UI 遍历时对假数据发 fetch → 404，
        且拼出的 URL 里 lessonId 是 [object Object]。
        
        现在所有 course / subject / lesson 全部由
        /content/courses/course-ai/... 真实文件加载（由 courseRegistry._loadS4Courses()
        + subjectRegistry.loadAllCourses() + contentLoader 驱动）。
        
        这段代码已彻底移除，不再注入任何假数据。
    -->
    <script>
        (function() {
            'use strict';
            console.log('[Bootstrap] ⏭️ Part 174 builtin data injection: disabled (v2.1.0)');
        })();
    </script>
