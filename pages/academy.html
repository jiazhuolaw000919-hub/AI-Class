<!DOCTYPE html>

        body { 
            margin: 0; 
            background: #0b1220; 
            color: #e2e8f0; 
            font-family: 'Inter', -apple-system, sans-serif; 
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
        }

        #academy-root {
            padding-top: 0 !important;
            margin-top: 0 !important;
            min-height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 80px;
        }
        #academy-root > *:first-child {
            margin-top: 0 !important;
            padding-top: 0 !important;
        }

        #law-runtime-root {
            display: none !important;
            height: 0 !important;
            min-height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            position: absolute !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        body > *:not(#academy-root):not(.bottom-nav):not(style):not(script) {
            display: none !important;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(20,20,40,0.92);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-around;
            padding: 6px 0 12px;
            z-index: 100;
        }
        .bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            color: #64748b;
            text-decoration: none;
            font-size: 9px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s;
            padding: 2px 12px;
        }
        .bottom-nav a:hover { color: #94a3b8; }
        .bottom-nav a.active { color: #4a9eff; }
        .bottom-nav a span:first-child { font-size: 18px; }
    </style>
</head>
<body>
    <div id="academy-root"></div>

    <nav class="bottom-nav">
        <a href="/" class="nav-item" data-tab="home">

    <script>
        (function() {
            'use strict';

            console.log('📄 Academy page loaded (v6.2.0)');

            function overrideAppFallback() {
                if (window.App) {
                    if (window.App._state) {
                        window.App._state.mounted = true;
                        window.App._state.healthy = true;
                        window.App._state.booted = true;
                        window.App._state.initialized = true;
                    }
                
                    if (typeof window.App._scheduleFallbackCheck === 'function') {
                        window.App._scheduleFallbackCheck = function() {
                            console.log('[Academy] 🛡️ Fallback check blocked');
                            this._state.mounted = true;
                            this._state.healthy = true;
                            this._state.booted = true;
                        };
                    }
                
                    var event = new CustomEvent('COMPOSER_MOUNTED', {
                        detail: { version: 'academy', mounted: true }
                    });
                    window.dispatchEvent(event);
                    document.dispatchEvent(event);
                
                    console.log('[Academy] ✅ App fallback overridden');
                    return true;
                }
                return false;
            }

            if (!overrideAppFallback()) {
                var checkInterval = setInterval(function() {
                    if (overrideAppFallback()) {
                        clearInterval(checkInterval);
                    }
                }, 100);
                setTimeout(function() {
                    clearInterval(checkInterval);
                }, 3000);
            }

            document.querySelectorAll('.nav-item').forEach(function(item) {
                item.addEventListener('click', function(e) {
                    var tab = this.dataset.tab;
                    if (tab === 'home') {
                        window.location.href = '/';
                        return;
                    }
                    if (tab === 'academy') {
                        window.location.href = '/pages/academy.html';
                        return;
                    }
                    e.preventDefault();
                    
                    if (tab === 'notes') {
                        if (window.LawAIApp?.AcademyExperienceManager) {
                            window.LawAIApp.AcademyExperienceManager.navigateToNotes();
                        } else {
                            window.location.hash = '#notes';
                            var event = new CustomEvent('NAVIGATE_TO_NOTES', {});
                            document.dispatchEvent(event);
                        }
                        return;
                    }

                    if (tab === 'calendar') {
                        showComingSoon('📅 Calendar');
                        return;
                    }

                    if (tab === 'settings') {
                        showComingSoon('⚙️ Settings');
                        return;
                    }

                    function showComingSoon(name) {
                        if (window.LawAIApp?.Toast && typeof window.LawAIApp.Toast.info === 'function') {
                            LawAIApp.Toast.info(name + ' coming soon! 🚧');
                        } else {
                            alert(name + ' coming soon! 🚧');
                        }
                    }
                });
            });

            function initAcademy() {
                var targetView = 'dashboard';
                if (window.location.hash === '#notes' || window.location.search.includes('view=notes')) {
                    targetView = 'notes';                   
                }
    
                console.log('🔥 Initializing Academy, targetView:', targetView);

                try {
                    // ============================================================
                    // 1. REGISTRY LAYER
                    // ============================================================
                    if (window.LawAIApp?.SchoolRegistry && !window.LawAIApp.SchoolRegistry.initialized) {
                        window.LawAIApp.SchoolRegistry.initialize();
                    }
                    if (window.LawAIApp?.ProgramRegistry && !window.LawAIApp.ProgramRegistry.initialized) {
                        window.LawAIApp.ProgramRegistry.initialize();
                    }
                    if (window.LawAIApp?.CourseRegistry && !window.LawAIApp.CourseRegistry.initialized) {
                        window.LawAIApp.CourseRegistry.initialize();
                    }
                    if (window.LawAIApp?.SubjectRegistry && !window.LawAIApp.SubjectRegistry.initialized) {
                        window.LawAIApp.SubjectRegistry.initialize();
                    }
                    if (window.LawAIApp?.CurriculumSeed && !window.LawAIApp.CurriculumSeed.loaded) {
                        window.LawAIApp.CurriculumSeed.load();
                    }

                    // ============================================================
                    // 2. EXPERIENCE MANAGER
                    // ============================================================
                    if (window.LawAIApp?.AcademyExperienceManager) {
                        if (!window.LawAIApp.AcademyExperienceManager.initialized) {
                            window.LawAIApp.AcademyExperienceManager.init();
                        }            
                            window.LawAIApp.AcademyExperienceManager.render();
                            console.log('✅ Academy rendered, viewMode:', window.LawAIApp.AcademyExperienceManager._state.viewMode);
                        }

                    // ============================================================
                    // 3. PART 54 — DECISION EXPERIENCE
                    // ============================================================
                    if (window.LawAIApp?.DecisionExperience && !window.LawAIApp.DecisionExperience.initialized) {
                        try {
                            window.LawAIApp.DecisionExperience.init();
                            console.log('[Academy] ✅ DecisionExperience initialized (Part 54)');
                        } catch (e) {
                            console.warn('[Academy] ⚠️ DecisionExperience init failed:', e);
                        }
                        } else if (window.LawAIApp?.DecisionExperience && window.LawAIApp.DecisionExperience.initialized) {
                        console.log('[Academy] ✅ DecisionExperience already initialized');
                    }

                    // ============================================================
                    // 4. PART 55 — ACTION → OUTCOME → ADAPTATION
                    // ============================================================

                    // 4a. ActionTracker
                    if (window.LawAIApp?.ActionTracker && !window.LawAIApp.ActionTracker.initialized) {
                        try {
                            window.LawAIApp.ActionTracker.init();
                            console.log('[Academy] ✅ ActionTracker initialized (Part 55)');
                        } catch (e) {
                            console.warn('[Academy] ⚠️ ActionTracker init failed:', e);
                        }

                        console.log('[Academy] ✅ OutcomeNormalizer already initialized');
                    }

                    // 4c. OutcomeLinker

                    } else if (window.LawAIApp?.LearningLoopValidator && window.LawAIApp.LearningLoopValidator.initialized) {

                    }

                    // ============================================================
                    // 7. PART 58 — LEARNER CONTROL & METACOGNITIVE EXPERIENCE
                    // ============================================================

                    // 7a. LearnerControl
                    if (window.LawAIApp?.LearnerControl && !window.LawAIApp.LearnerControl.initialized) {
                        try {

                        }
                    } else if (window.LawAIApp?.MetacognitiveExperience && window.LawAIApp.MetacognitiveExperience.initialized) {
                        console.log('[Academy] ✅ MetacognitiveExperience already initialized');
                    }

                    // ============================================================
                    // 8. PART 59 — LEARNING PATTERNS & SELF-AWARENESS
                    // ============================================================

                    // 8a. LearningPatternModel (纯数据契约，不需要 init)
                    // 8b. PatternDetector
                    if (window.LawAIApp?.PatternDetector && !window.LawAIApp.PatternDetector.initialized) {
                        try {

                    } else if (window.LawAIApp?.PatternExplainer && window.LawAIApp.PatternExplainer.initialized) {
                        console.log('[Academy] ✅ PatternExplainer already initialized');
                    }

                    // ============================================================
                    // 9. PART 60 — EPISTEMIC JUDGMENT & AI LITERACY
                    // ============================================================

                    // 9a. EpistemicStatus (纯数据模型，不需要 init)
                    // 9b. SourceDistinguisher
                    if (window.LawAIApp?.SourceDistinguisher && !window.LawAIApp.SourceDistinguisher.initialized) {
                        try {
                            window.LawAIApp.SourceDistinguisher.init();
                            console.log('[Academy] ✅ SourceDistinguisher initialized (Part 60)');
                        } catch (e) {
                            console.warn('[Academy] ⚠️ SourceDistinguisher init failed:', e);
                        }
                    } else if (window.LawAIApp?.SourceDistinguisher && window.LawAIApp.SourceDistinguisher.initialized) {
                        console.log('[Academy] ✅ SourceDistinguisher already initialized');
                    }

                    // 9c. AILiteracyHelper
                    if (window.LawAIApp?.AILiteracyHelper && !window.LawAIApp.AILiteracyHelper.initialized) {
                        try {
                            window.LawAIApp.AILiteracyHelper.init();
                            console.log('[Academy] ✅ AILiteracyHelper initialized (Part 60)');
                        } catch (e) {
                            console.warn('[Academy] ⚠️ AILiteracyHelper init failed:', e);
                        }
                    } else if (window.LawAIApp?.AILiteracyHelper && window.LawAIApp.AILiteracyHelper.initialized) {
                        console.log('[Academy] ✅ AILiteracyHelper already initialized');
                    }

                    // ============================================================
                    // 10. PART 61 — LEARNING TRANSFER & INDEPENDENCE
                    // ============================================================

                    // 10a. TransferObserver
                    if (window.LawAIApp?.TransferObserver && !window.LawAIApp.TransferObserver.initialized) {
                        try {
                            window.LawAIApp.TransferObserver.init();
                            console.log('[Academy] ✅ TransferObserver initialized (Part 61)');
                        } catch (e) {
                            console.warn('[Academy] ⚠️ TransferObserver init failed:', e);
                        }
                    } else if (window.LawAIApp?.TransferObserver && window.LawAIApp.TransferObserver.initialized) {
                        console.log('[Academy] ✅ TransferObserver already initialized');
                    }

                    // 10b. TransferRecommender
                    if (window.LawAIApp?.TransferRecommender && !window.LawAIApp.TransferRecommender.initialized) {
                        try {
                            window.LawAIApp.TransferRecommender.init();
                            console.log('[Academy] ✅ TransferRecommender initialized (Part 61)');
                        } catch (e) {
                            console.warn('[Academy] ⚠️ TransferRecommender init failed:', e);
                        }
                    } else if (window.LawAIApp?.TransferRecommender && window.LawAIApp.TransferRecommender.initialized) {
                        console.log('[Academy] ✅ TransferRecommender already initialized');
                    }

                    // ============================================================
                    // 11. PART 62 — CALIBRATION & EVALUATIVE JUDGMENT
                    // ============================================================

                    // 11a. CalibrationObserver
                    if (window.LawAIApp?.CalibrationObserver && !window.LawAIApp.CalibrationObserver.initialized) {

                    } else if (window.LawAIApp?.CalibrationObserver && window.LawAIApp.CalibrationObserver.initialized) {

                    }

                    // 11b. CalibrationRecommender
                    if (window.LawAIApp?.CalibrationRecommender && !window.LawAIApp.CalibrationRecommender.initialized) {
                        try {
                            window.LawAIApp.CalibrationRecommender.init();
                            console.log('[Academy] ✅ CalibrationRecommender initialized (Part 62)');
                        } catch (e) {
                            console.warn('[Academy] ⚠️ CalibrationRecommender init failed:', e);
                        }
                    } else if (window.LawAIApp?.CalibrationRecommender && window.LawAIApp.CalibrationRecommender.initialized) {
                        console.log('[Academy] ✅ CalibrationRecommender already initialized');
                    }

                    // ============================================================
                    // 5. LEGACY — Learning Journey Adapter
                    // ============================================================
                    if (window.LawAIApp?.LearningJourneyAdapter && !window.LawAIApp.LearningJourneyAdapter.initialized) {
                        try {
                            window.LawAIApp.LearningJourneyAdapter.init();
                            console.log('[Academy] ✅ LearningJourneyAdapter initialized');
                        } catch (e) {
                            console.warn('[Academy] ⚠️ LearningJourneyAdapter init failed:', e);
                        }
                    }

                    // ============================================================
                    // 6. LEGACY — Experience Intelligence
                    // ============================================================
                    if (window.LawAIApp?.ExperienceIntelligence && !window.LawAIApp.ExperienceIntelligence.initialized) {
                        try {
                            window.LawAIApp.ExperienceIntelligence.init();
                            console.log('[Academy] ✅ ExperienceIntelligence initialized');
                        } catch (e) {
                            console.warn('[Academy] ⚠️ ExperienceIntelligence init failed:', e);
                        }
                    }

                    // ============================================================
                    // 7. 如果有 Notes 视图，跳转
                    // ============================================================
                    if (targetView === 'notes' && window.LawAIApp?.AcademyExperienceManager) {
                        window.LawAIApp.AcademyExperienceManager.navigateToNotes();
                    }

                } catch (error) {
                    console.error('❌ Academy init error:', error);
                }
            }
                    
            if (document.readyState === 'complete') {
                setTimeout(initAcademy, 200);
            } else {
                window.addEventListener('load', function() {
                    setTimeout(initAcademy, 200);
                });
            }

            console.log('✅ Academy page ready');
        })();
    </script>
</body>
</html>
