<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ Academy | Law AI</title>
    <link rel="stylesheet" href="/css/academy.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/animation.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/learning.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        body { margin: 0; background: #0b1220; color: #e2e8f0; font-family: 'Inter', -apple-system, sans-serif; }
        #academy-root { min-height: 100vh; max-width: 1200px; margin: 0 auto; padding-bottom: 80px; }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(20,20,40,0.92);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-around;
            padding: 6px 0 12px;
            z-index: 100;
        }
        .bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            color: #64748b;
            text-decoration: none;
            font-size: 9px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s;
            padding: 2px 12px;
        }
        .bottom-nav a:hover { color: #94a3b8; }
        .bottom-nav a.active { color: #4a9eff; }
        .bottom-nav a span:first-child { font-size: 18px; }
    </style>
</head>
<body>
    <!-- ========================================================== -->
    <!-- 🔥 Academy 容器 — 只有这一个容器！                         -->
    <!-- ========================================================== -->
    <div id="academy-root"></div>

    <!-- ========================================================== -->
    <!-- 底部导航                                                  -->
    <!-- ========================================================== -->
    <nav class="bottom-nav">
        <a href="/" class="nav-item" data-tab="home">
            <span>🏠</span><span>Home</span>
        </a>
        <a href="/pages/academy.html" class="nav-item active" data-tab="academy">
            <span>📚</span><span>Academy</span>
        </a>
        <a href="#" class="nav-item" data-tab="calendar">
            <span>📅</span><span>Calendar</span>
        </a>
        <a href="#" class="nav-item" data-tab="notes">
            <span>📝</span><span>Notes</span>
        </a>
        <a href="#" class="nav-item" data-tab="settings">
            <span>⚙️</span><span>Settings</span>
        </a>
    </nav>

    <!-- ========================================================== -->
    <!-- 脚本加载 — 最小化，由 Experience 层接管                    -->
    <!-- ========================================================== -->
    <script src="/js/storageEngine.js"></script>
    <script src="/js/eventBus.js"></script>
    <script src="/js/profileEngine.js"></script>
    <script src="/js/progressEngine.js"></script>
    <script src="/js/router.js"></script>
    <script src="/js/loader.js"></script>
    <script src="/js/academy/academyManifest.js"></script>
    <script src="/js/academy/academyLoader.js"></script>
    <script src="/js/academy/academyExperienceManager.js"></script>
    <script src="/js/academy/academyView.js"></script>

    <script>
        (function() {
            console.log('📄 Academy page loaded (v6.1.0)');

            // ============================================================
            // 🔥 覆盖 app.js 的 fallback 机制 (阻止错误页面)
            // ============================================================
            function overrideAppFallback() {
                if (window.App) {
                    // 强制标记为已挂载
                    if (window.App._state) {
                        window.App._state.mounted = true;
                        window.App._state.healthy = true;
                        window.App._state.booted = true;
                        window.App._state.initialized = true;
                    }
                    
                    // 覆盖 fallback 检查
                    if (typeof window.App._scheduleFallbackCheck === 'function') {
                        window.App._scheduleFallbackCheck = function() {
                            console.log('[Academy] 🛡️ Fallback check blocked');
                            this._state.mounted = true;
                            this._state.healthy = true;
                            this._state.booted = true;
                        };
                    }
                    
                    // 触发 COMPOSER_MOUNTED 事件
                    var event = new CustomEvent('COMPOSER_MOUNTED', {
                        detail: { version: 'academy', mounted: true }
                    });
                    window.dispatchEvent(event);
                    document.dispatchEvent(event);
                    
                    console.log('[Academy] ✅ App fallback overridden');
                    return true;
                }
                return false;
            }

            // 立即尝试覆盖
            if (!overrideAppFallback()) {
                // 如果 App 还没加载，等待
                var checkInterval = setInterval(function() {
                    if (overrideAppFallback()) {
                        clearInterval(checkInterval);
                    }
                }, 100);
                setTimeout(function() {
                    clearInterval(checkInterval);
                }, 3000);
            }

            // ============================================================
            // 🔥 直接初始化 Academy
            // ============================================================
            function initAcademy() {
                console.log('🔥 Initializing Academy...');

                try {
                    // 1. SchoolRegistry
                    if (window.LawAIApp?.SchoolRegistry && !window.LawAIApp.SchoolRegistry.initialized) {
                        window.LawAIApp.SchoolRegistry.initialize();
                        console.log('✅ SchoolRegistry initialized');
                    }

                    // 2. ProgramRegistry
                    if (window.LawAIApp?.ProgramRegistry && !window.LawAIApp.ProgramRegistry.initialized) {
                        window.LawAIApp.ProgramRegistry.initialize();
                        console.log('✅ ProgramRegistry initialized');
                    }

                    // 3. CourseRegistry
                    if (window.LawAIApp?.CourseRegistry && !window.LawAIApp.CourseRegistry.initialized) {
                        window.LawAIApp.CourseRegistry.initialize();
                        console.log('✅ CourseRegistry initialized');
                    }

                    // 4. CurriculumSeed
                    if (window.LawAIApp?.CurriculumSeed && !window.LawAIApp.CurriculumSeed.loaded) {
                        window.LawAIApp.CurriculumSeed.load();
                        console.log('✅ CurriculumSeed loaded');
                    }

                    // 5. AcademyExperienceManager — 渲染
                    if (window.LawAIApp?.AcademyExperienceManager) {
                        if (!window.LawAIApp.AcademyExperienceManager.initialized) {
                            window.LawAIApp.AcademyExperienceManager.init();
                        }
                        window.LawAIApp.AcademyExperienceManager.render();
                        console.log('✅ Academy rendered!');
                    } else {
                        console.warn('⚠️ AcademyExperienceManager not found');
                    }

                } catch (error) {
                    console.error('❌ Academy init error:', error);
                }
            }

            // ============================================================
            // 底部导航
            // ============================================================
            document.querySelectorAll('.nav-item').forEach(function(item) {
                item.addEventListener('click', function(e) {
                    var tab = this.dataset.tab;
                    if (tab === 'home') {
                        window.location.href = '/';
                        return;
                    }
                    if (tab === 'academy') {
                        window.location.href = '/pages/academy.html';
                        return;
                    }
                    e.preventDefault();
                    var tabNames = {
                        'calendar': '📅 Calendar',
                        'notes': '📝 Notes',
                        'settings': '⚙️ Settings'
                    };
                    if (window.LawAIApp?.Toast && typeof LawAIApp.Toast.info === 'function') {
                        LawAIApp.Toast.info(tabNames[tab] + ' coming soon! 🚧');
                    } else {
                        alert(tabNames[tab] + ' coming soon! 🚧');
                    }
                });
            });

            // ============================================================
            // 启动 Academy
            // ============================================================
            // 等待 Academy 文件加载完成
            setTimeout(function() {
                initAcademy();
            }, 500);

            console.log('✅ Academy page ready');

        })();
    </script>
</body>
</html>
