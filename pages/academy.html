<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ Academy | Law AI</title>
    <link rel="stylesheet" href="/css/academy.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/animation.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/learning.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        body { margin: 0; background: #0b1220; color: #e2e8f0; font-family: 'Inter', -apple-system, sans-serif; }
        html, body { margin: 0 !important; padding: 0 !important; }
        #academy-root { padding-top: 0 !important; margin-top: 0 !important; min-height: 100vh; max-width: 1200px; margin: 0 auto; padding-bottom: 80px; }
        #academy-root > *:first-child { margin-top: 0 !important; padding-top: 0 !important; }
        #law-runtime-root { display: none !important; height: 0 !important; min-height: 0 !important; margin: 0 !important; padding: 0 !important; overflow: hidden !important; position: absolute !important; opacity: 0 !important; pointer-events: none !important; }
        body > *:not(#academy-root):not(.bottom-nav):not(style):not(script) { display: none !important; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20,20,40,0.92); backdrop-filter: blur(12px); border-top: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-around; padding: 6px 0 12px; z-index: 100; }
        .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 1px; color: #64748b; text-decoration: none; font-size: 9px; font-weight: 500; cursor: pointer; transition: color 0.2s; padding: 2px 12px; }
        .bottom-nav a:hover { color: #94a3b8; }
        .bottom-nav a.active { color: #4a9eff; }
        .bottom-nav a span:first-child { font-size: 18px; }
    </style>
</head>
<body>
    <div id="academy-root"></div>

    <nav class="bottom-nav">
        <a href="/" class="nav-item" data-tab="home"><span>🏠</span><span>Home</span></a>
        <a href="/pages/academy.html" class="nav-item active" data-tab="academy"><span>📚</span><span>Academy</span></a>
        <a href="#" class="nav-item" data-tab="calendar"><span>📅</span><span>Calendar</span></a>
        <a href="#" class="nav-item" data-tab="notes"><span>📝</span><span>Notes</span></a>
        <a href="#" class="nav-item" data-tab="settings"><span>⚙️</span><span>Settings</span></a>
    </nav>

    <!-- 基础脚本 -->
    <script src="/js/storageEngine.js"></script>
    <script src="/js/eventBus.js"></script>
    <script src="/js/profileEngine.js"></script>
    <script src="/js/progressEngine.js"></script>
    <script src="/js/router.js"></script>
    <script src="/js/loader.js"></script>

    <!-- Academy 相关 -->
    <script src="/js/academy/academyManifest.js"></script>
    <script src="/js/academy/academyLoader.js"></script>
    <script src="/js/academy/academyExperienceManager.js"></script>
    <script src="/js/academy/notesView.js"></script>
    <script src="/js/academy/academyView.js"></script>
    <script src="/js/academy/learningJourneyAdapter.js"></script>

    <!-- 核心学习引擎 -->
    <script src="/js/memoryEngine.js"></script>
    <script src="/js/masteryEngine.js"></script>
    <script src="/js/recommendationEngine.js"></script>
    <script src="/js/learnerModel.js"></script>
    <script src="/js/memoryTracker.js"></script>
    <script src="/js/memoryScheduler.js"></script>
    <script src="/js/memoryAnalytics.js"></script>
    <script src="/js/memoryReview.js"></script>
    <script src="/js/adaptiveMemory.js"></script>

    <script>
        (function() {
            'use strict';

            console.log('📄 Academy page loaded (v10.0 - Lazy Calendar + Settings)');

            // ============================================================
            // 状态
            // ============================================================
            var _isCalendarView = false;
            var _isSettingsView = false;
            var _calendarLoaded = false;
            var _calendarLoading = false;
            var _settingsLoaded = false;
            var _settingsLoading = false;

            // ============================================================
            // 工具函数
            // ============================================================
            function showComingSoon(name) {
                if (window.LawAIApp?.Toast?.info) {
                    LawAIApp.Toast.info(name + ' coming soon! 🚧');
                } else {
                    alert(name + ' coming soon! 🚧');
                }
            }

            function updateNavHighlight(activeTab) {
                document.querySelectorAll('.nav-item').forEach(function(nav) {
                    if (nav.dataset.tab === activeTab) {
                        nav.style.color = '#4a9eff';
                        nav.classList.add('active');
                    } else {
                        nav.style.color = '#64748b';
                        nav.classList.remove('active');
                    }
                });
            }

            // ============================================================
            // 内联 Calendar（快速 fallback）
            // ============================================================
            function createInlineCalendar() {
                return {
                    currentYear: new Date().getFullYear(),
                    currentMonth: new Date().getMonth(),

                    render: function() {
                        var container = document.getElementById('academy-root');
                        if (!container) return;

                        var monthName = new Date(this.currentYear, this.currentMonth).toLocaleString('default', { month: 'long' });
                        var daysInMonth = new Date(this.currentYear, this.currentMonth + 1, 0).getDate();
                        var firstDay = new Date(this.currentYear, this.currentMonth, 1).getDay();

                        var gridHTML = '';
                        for (var i = 0; i < firstDay; i++) gridHTML += '<div></div>';
                        for (var d = 1; d <= daysInMonth; d++) {
                            var isToday = d === new Date().getDate() && 
                                            this.currentMonth === new Date().getMonth() && 
                                            this.currentYear === new Date().getFullYear();
                            gridHTML += '<div style="padding:12px 6px;text-align:center;border-radius:8px;background:' + 
                                (isToday ? 'rgba(74,158,255,0.15)' : 'rgba(255,255,255,0.03)') + 
                                ';border:1px solid ' + (isToday ? 'rgba(74,158,255,0.3)' : 'rgba(255,255,255,0.04)') + 
                                ';color:' + (isToday ? '#4a9eff' : '#e2e8f0') + 
                                ';font-size:14px;cursor:pointer;font-family:inherit;">' + d + '</div>';
                        }

                        container.innerHTML = `
                            <div style="max-width:900px;margin:0 auto;padding:20px;color:#e2e8f0;font-family:'Inter',sans-serif;">
                                <div style="display:flex;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;">
                                    <button onclick="window.location.href='/pages/academy.html'" style="background:rgba(74,158,255,0.08);border:1px solid rgba(74,158,255,0.15);color:#4a9eff;padding:8px 16px;border-radius:100px;cursor:pointer;font-family:inherit;font-size:13px;">← Back to Academy</button>
                                    <button onclick="history.back()" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);color:#94a3b8;padding:8px 16px;border-radius:100px;cursor:pointer;font-family:inherit;font-size:13px;">⬅️ 返回上一页</button>
                                </div>
                                <h2 style="margin:0 0 4px;font-size:24px;font-weight:700;">📅 Calendar</h2>
                                <p style="color:#94a3b8;margin:0 0 20px;">${monthName} ${this.currentYear}</p>
                                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                                    <button onclick="LawAIApp.Calendar.changeMonth(-1)" style="padding:8px 20px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:100px;color:#94a3b8;cursor:pointer;font-family:inherit;">←</button>
                                    <span style="font-weight:600;font-size:18px;">${monthName} ${this.currentYear}</span>
                                    <button onclick="LawAIApp.Calendar.changeMonth(1)" style="padding:8px 20px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:100px;color:#94a3b8;cursor:pointer;font-family:inherit;">→</button>
                                </div>
                                <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;color:#64748b;margin-bottom:8px;">
                                    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                                </div>
                                <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;">${gridHTML}</div>
                            </div>
                        `;
                    },

                    changeMonth: function(delta) {
                        this.currentMonth += delta;
                        if (this.currentMonth > 11) { this.currentMonth = 0; this.currentYear++; }
                        if (this.currentMonth < 0) { this.currentMonth = 11; this.currentYear--; }
                        this.render();
                    }
                };
            }

            // ============================================================
            // 内联 Settings（快速 fallback）
            // ============================================================
            function createInlineSettings() {
                return {
                    render: function() {
                        var container = document.getElementById('academy-root');
                        if (!container) return;

                        container.innerHTML = `
                            <div style="max-width:700px;margin:0 auto;padding:20px;color:#e2e8f0;font-family:'Inter',sans-serif;">
                                <div style="display:flex;justify-content:space-between;margin-bottom:16px;">
                                    <button onclick="window.location.href='/pages/academy.html'" style="background:rgba(74,158,255,0.08);border:1px solid rgba(74,158,255,0.15);color:#4a9eff;padding:8px 16px;border-radius:100px;cursor:pointer;font-family:inherit;font-size:13px;">← Back to Academy</button>
                                </div>
                                <h2 style="margin:0 0 20px;font-size:24px;font-weight:700;">⚙️ Settings</h2>
                                <div style="display:flex;flex-direction:column;gap:12px;">
                                    <div style="background:rgba(255,255,255,0.03);border-radius:12px;padding:16px;border:1px solid rgba(255,255,255,0.04);">
                                        <h3 style="margin:0 0 8px;font-size:14px;font-weight:600;">👤 Profile</h3>
                                        <p style="margin:0;color:#94a3b8;font-size:13px;">Manage your profile settings</p>
                                    </div>
                                    <div style="background:rgba(255,255,255,0.03);border-radius:12px;padding:16px;border:1px solid rgba(255,255,255,0.04);">
                                        <h3 style="margin:0 0 8px;font-size:14px;font-weight:600;">🎯 Learning Preferences</h3>
                                        <p style="margin:0;color:#94a3b8;font-size:13px;">Adjust your learning preferences</p>
                                    </div>
                                    <div style="background:rgba(255,255,255,0.03);border-radius:12px;padding:16px;border:1px solid rgba(255,255,255,0.04);">
                                        <h3 style="margin:0 0 8px;font-size:14px;font-weight:600;">🔔 Notifications</h3>
                                        <p style="margin:0;color:#94a3b8;font-size:13px;">Manage notification settings</p>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                };
            }

            // ============================================================
            // 渲染 Calendar（懒加载 + 内联 fallback）
            // ============================================================
            function renderCalendar() {
                _isCalendarView = true;
                _isSettingsView = false;
                var container = document.getElementById('academy-root');
                if (!container) return;

                if (_calendarLoaded && window.LawAIApp?.Calendar) {
                    try {
                        window.LawAIApp.Calendar._root = container;
                        window.LawAIApp.Calendar.render();
                        updateNavHighlight('calendar');
                        return;
                    } catch (e) {
                        window.LawAIApp.Calendar = createInlineCalendar();
                        window.LawAIApp.Calendar.render();
                        updateNavHighlight('calendar');
                        return;
                    }
                }

                if (_calendarLoading) {
                    container.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8;">⏳ Loading Calendar...</div>';
                    return;
                }

                window.LawAIApp = window.LawAIApp || {};
                window.LawAIApp.Calendar = createInlineCalendar();
                window.LawAIApp.Calendar.render();
                updateNavHighlight('calendar');

                _calendarLoading = true;
                loadFullCalendar();
            }

            // ============================================================
            // 渲染 Settings（懒加载 + 内联 fallback）
            // ============================================================
            function renderSettings() {
                _isSettingsView = true;
                _isCalendarView = false;
                var container = document.getElementById('academy-root');
                if (!container) return;

                if (_settingsLoaded && window.LawAIApp?.Settings) {
                    try {
                        window.LawAIApp.Settings.render();
                        updateNavHighlight('settings');
                        return;
                    } catch (e) {
                        window.LawAIApp.Settings = createInlineSettings();
                        window.LawAIApp.Settings.render();
                        updateNavHighlight('settings');
                        return;
                    }
                }

                if (_settingsLoading) {
                    container.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8;">⏳ Loading Settings...</div>';
                    return;
                }

                window.LawAIApp = window.LawAIApp || {};
                window.LawAIApp.Settings = createInlineSettings();
                window.LawAIApp.Settings.render();
                updateNavHighlight('settings');

                _settingsLoading = true;
                loadFullSettings();
            }

            // ============================================================
            // 后台加载完整 Calendar
            // ============================================================
            function loadFullCalendar() {
                console.log('[Academy] 🔄 Loading full Calendar...');
                var files = [
                    '/js/calendarEngine.js',
                    '/js/calendarPlanner.js',
                    '/js/calendarTimeline.js',
                    '/js/calendarEngineAdapter.js',
                    '/js/calendar/CalendarSurfaceAdapter.js',
                    '/js/calendar/CalendarViewModel.js',
                    '/js/calendar/CalendarEventAdapter.js',
                    '/js/calendar/CalendarRenderer.js',
                    '/js/calendar.js'
                ];
                var loaded = 0;
                files.forEach(function(file) {
                    var script = document.createElement('script');
                    script.src = file + '?v=' + Date.now();
                    script.async = true;
                    script.onload = function() {
                        loaded++;
                        if (loaded === files.length) {
                            _calendarLoading = false;
                            if (window.LawAIApp?.Calendar) {
                                _calendarLoaded = true;
                                if (_isCalendarView) {
                                    var c = document.getElementById('academy-root');
                                    if (c) { window.LawAIApp.Calendar._root = c; window.LawAIApp.Calendar.render(); updateNavHighlight('calendar'); }
                                }
                            }
                        }
                    };
                    script.onerror = function() { loaded++; };
                    document.head.appendChild(script);
                });
            }

            // ============================================================
            // 后台加载完整 Settings
            // ============================================================
            function loadFullSettings() {
                console.log('[Academy] 🔄 Loading full Settings...');
                var script = document.createElement('script');
                script.src = '/js/settings.js?v=' + Date.now();
                script.async = true;
                script.onload = function() {
                    _settingsLoading = false;
                    if (window.LawAIApp?.Settings) {
                        _settingsLoaded = true;
                        if (_isSettingsView) {
                            try { window.LawAIApp.Settings.render(); updateNavHighlight('settings'); } catch (e) {}
                        }
                    }
                };
                script.onerror = function() { _settingsLoading = false; };
                document.head.appendChild(script);
            }

            // ============================================================
            // 导航点击
            // ============================================================
            document.querySelectorAll('.nav-item').forEach(function(item) {
                item.addEventListener('click', function(e) {
                    var tab = this.dataset.tab;

                    if (tab === 'home') { _isCalendarView = false; _isSettingsView = false; window.location.href = '/'; return; }
                    if (tab === 'academy') { _isCalendarView = false; _isSettingsView = false; window.location.href = '/pages/academy.html'; return; }

                    e.preventDefault();

                    if (tab === 'notes') {
                        _isCalendarView = false;
                        _isSettingsView = false;
                        if (window.LawAIApp?.AcademyExperienceManager) {
                            window.LawAIApp.AcademyExperienceManager.navigateToNotes();
                            updateNavHighlight('notes');
                        }
                        return;
                    }

                    if (tab === 'calendar') {
                        renderCalendar();
                        return;
                    }

                    if (tab === 'settings') {
                        renderSettings();
                        return;
                    }
                });
            });

            // ============================================================
            // 初始化 Academy
            // ============================================================
            function initAcademy() {
                if (_isCalendarView || _isSettingsView) return;
                if (window.location.search.includes('view=calendar')) { renderCalendar(); return; }
                if (window.location.search.includes('view=settings')) { renderSettings(); return; }

                try {
                    if (window.LawAIApp?.AcademyExperienceManager) {
                        if (!window.LawAIApp.AcademyExperienceManager.initialized) {
                            window.LawAIApp.AcademyExperienceManager.init();
                        }
                        window.LawAIApp.AcademyExperienceManager.render();
                    }
                } catch (e) {
                    console.warn('[Academy] Init error:', e);
                }
            }

            if (document.readyState === 'complete') {
                setTimeout(initAcademy, 200);
            } else {
                window.addEventListener('load', function() { setTimeout(initAcademy, 200); });
            }

            console.log('✅ Academy page ready (lazy Calendar + Settings)');
        })();
    </script>
</body>
</html>
