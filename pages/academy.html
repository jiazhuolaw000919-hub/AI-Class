<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ Academy | Law AI</title>
    <link rel="stylesheet" href="/css/academy.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/animation.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/learning.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        body { margin: 0; background: #0b1220; color: #e2e8f0; font-family: 'Inter', -apple-system, sans-serif; }
        html, body { margin: 0 !important; padding: 0 !important; }
        #academy-root { padding-top: 0 !important; margin-top: 0 !important; min-height: 100vh; max-width: 1200px; margin: 0 auto; padding-bottom: 80px; }
        #academy-root > *:first-child { margin-top: 0 !important; padding-top: 0 !important; }
        #law-runtime-root { display: none !important; height: 0 !important; min-height: 0 !important; margin: 0 !important; padding: 0 !important; overflow: hidden !important; position: absolute !important; opacity: 0 !important; pointer-events: none !important; }
        body > *:not(#academy-root):not(.bottom-nav):not(style):not(script) { display: none !important; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20,20,40,0.92); backdrop-filter: blur(12px); border-top: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-around; padding: 6px 0 12px; z-index: 100; }
        .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 1px; color: #64748b; text-decoration: none; font-size: 9px; font-weight: 500; cursor: pointer; transition: color 0.2s; padding: 2px 12px; }
        .bottom-nav a:hover { color: #94a3b8; }
        .bottom-nav a.active { color: #4a9eff; }
        .bottom-nav a span:first-child { font-size: 18px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="academy-root"></div>

    <nav class="bottom-nav">
        <a href="/" class="nav-item" data-tab="home"><span>🏠</span><span>Home</span></a>
        <a href="/pages/academy.html" class="nav-item active" data-tab="academy"><span>📚</span><span>Academy</span></a>
        <a href="#" class="nav-item" data-tab="calendar"><span>📅</span><span>Calendar</span></a>
        <a href="#" class="nav-item" data-tab="notes"><span>📝</span><span>Notes</span></a>
        <a href="#" class="nav-item" data-tab="settings"><span>⚙️</span><span>Settings</span></a>
    </nav>

    <!-- 1. 基础层 -->
    <script src="/js/storageEngine.js"></script>
    <script src="/js/eventBus.js"></script>
    <script src="/js/profileEngine.js"></script>
    <script src="/js/progressEngine.js"></script>
    <script src="/js/router.js"></script>
    <script src="/js/loader.js"></script>
    <script src="/js/systemComposer.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/bootstrap.js"></script>

    <!-- 2. 核心学习引擎（跨页面共用） -->
    <script src="/js/memoryEngine.js"></script>
    <script src="/js/masteryEngine.js"></script>
    <script src="/js/recommendationEngine.js"></script>
    <script src="/js/learnerModel.js"></script>
    <script src="/js/memoryTracker.js"></script>
    <script src="/js/memoryScheduler.js"></script>
    <script src="/js/memoryAnalytics.js"></script>
    <script src="/js/memoryReview.js"></script>
    <script src="/js/adaptiveMemory.js"></script>

    <!-- 3. LessonView -->
    <script src="/js/lessonView.js"></script>

    <!-- 4. AcademyManifest（可选：有就加载） -->
    <script src="/js/academy/academyManifest.js"></script>

    <!-- 5. AcademyLoader（核心：其他 Academy 模块自动加载） -->
    <script src="/js/academy/academyLoader.js"></script>

    <!-- 6. DevTools / DevPanel（可选：只用于调试，不需要可整段删掉） -->
    <script src="/js/dev/runtimeProfiler.js"></script>
    <script src="/js/dev/performanceCollector.js"></script>
    <script src="/js/dev/runtimeReport.js"></script>
    <script src="/js/dev/developerOverlay.js"></script>
    <script src="/js/debug/devPanel.js"></script>
    <script src="/js/debug/panels/runtimePanel.js"></script>
    <script src="/js/debug/panels/performancePanel.js"></script>
    <script src="/js/debug/panels/eventPanel.js"></script>
    <script src="/js/debug/panels/tracePanel.js"></script>
    <script src="/js/debug/panels/statePanel.js"></script>
    <script src="/js/debug/panels/cognitivePanel.js"></script>
    <script src="/js/debug/panels/governancePanel.js"></script>
    <script src="/js/debug/panels/explorerPanel.js"></script>
    <script src="/js/debug/panels/autonomousPanel.js"></script>
    <script src="/js/debug/panels/predictivePanel.js"></script>
    <script src="/js/debug/panels/evolutionPanel.js"></script>
    <script src="/js/debug/panels/orchestrationPanel.js"></script>
    <script src="/js/debug/panels/productionPanel.js"></script>
    <script src="/js/debug/panels/decisionPanel.js"></script>
    <script src="/js/debug/panels/outcomePanel.js"></script>
    <script src="/js/debug/panels/adaptationPanel.js"></script>
    <script src="/js/debug/panels/metacognitivePanel.js"></script>
    <script src="/js/debug/panels/patternPanel.js"></script>
    <script src="/js/debug/panels/epistemicPanel.js"></script>
    <script src="/js/debug/panels/transferPanel.js"></script>
    <script src="/js/debug/panels/calibrationPanel.js"></script>
    <script src="/js/debug/panels/journeyPanel.js"></script>
    <script src="/js/debug/panels/agencyPanel.js"></script>
    <script src="/js/debug/architectureGuardrail.js"></script>
    <script src="/js/debug/panels/architecturePanel.js"></script>

    <!-- 7. Academy 启动脚本 -->
    <script>
        (function() {
            'use strict';

            console.log('📄 Academy page loaded (Loader-based)');

            document.querySelectorAll('.nav-item').forEach(function(item) {
                item.addEventListener('click', function(e) {
                    var tab = this.dataset.tab;

                    if (tab === 'home') {
                        window.location.href = '/';
                        return;
                    }
                    if (tab === 'academy') {
                        window.location.href = '/pages/academy.html';
                        return;
                    }

                    e.preventDefault();

                    var loader = window.LawAIApp?.AcademyLoader;
                    var container = document.getElementById('academy-root');
                    if (!loader || !container) return;

                    if (tab === 'calendar') {
                        loader.renderCalendar(container, function() {
                            loader.updateNavHighlight('calendar');
                        });
                        return;
                    }

                    if (tab === 'settings') {
                        loader.renderSettings(container, function() {
                            loader.updateNavHighlight('settings');
                        });
                        return;
                    }

                    if (tab === 'notes') {
                        var event = new CustomEvent('NAVIGATE_TO_NOTES', {
                            detail: { source: 'bottom-nav' }
                        });
                        document.dispatchEvent(event);
                        return;
                    }
                });
            });

            document.addEventListener('NAVIGATE_TO_NOTES', function(e) {
                console.log('[Academy] 📝 NAVIGATE_TO_NOTES received');
                var loader = window.LawAIApp?.AcademyLoader;
                var container = document.getElementById('academy-root');
                if (!loader || !container) return;

                container.innerHTML = `
                    <div style="text-align:center;padding:60px;color:#94a3b8;">
                        <div style="font-size:48px;margin-bottom:16px;animation:pulse 2s ease-in-out infinite;">📝</div>
                        <p>Loading Notes...</p>
                    </div>
                `;

                if (loader.loadNotesAuthority) {
                    loader.loadNotesAuthority(function(auth) {
                        console.log('[Academy] ✅ NotesAuthority ready');
                        if (window.LawAIApp?.Notes?.render) {
                            window.LawAIApp.Notes._root = container;
                            window.LawAIApp.Notes.render();
                            loader.updateNavHighlight('notes');
                        } else {
                            container.innerHTML = `
                                <div style="max-width:900px;margin:0 auto;padding:60px;text-align:center;color:#94a3b8;">
                                    <div style="font-size:48px;margin-bottom:16px;">📝</div>
                                    <h3 style="color:#e2e8f0;">Notes module not loaded</h3>
                                    <p style="margin:8px 0 16px;">Notes UI is not available.</p>
                                    <button onclick="window.location.href='/pages/academy.html'" style="padding:8px 20px;background:rgba(74,158,255,0.08);border:1px solid rgba(74,158,255,0.15);border-radius:100px;color:#4a9eff;cursor:pointer;font-family:inherit;">← Back to Academy</button>
                                </div>
                            `;
                        }
                    }, function(error) {
                        console.warn('[Academy] ⚠️ NotesAuthority load failed:', error);
                        container.innerHTML = `
                            <div style="max-width:900px;margin:0 auto;padding:60px;text-align:center;color:#94a3b8;">
                                <div style="font-size:48px;margin-bottom:16px;">⚠️</div>
                                <h3 style="color:#e2e8f0;">Notes unavailable</h3>
                                <p style="margin:8px 0 16px;">Please try again later.</p>
                                <button onclick="window.location.href='/pages/academy.html'" style="padding:8px 20px;background:rgba(74,158,255,0.08);border:1px solid rgba(74,158,255,0.15);border-radius:100px;color:#4a9eff;cursor:pointer;font-family:inherit;">← Back to Academy</button>
                            </div>
                        `;
                    });
                }
            });

            function initAcademy() {
                if (window.location.search.includes('view=calendar')) {
                    var container = document.getElementById('academy-root');
                    var loader = window.LawAIApp?.AcademyLoader;
                    if (container && loader) loader.renderCalendar(container);
                    return;
                }
                if (window.location.search.includes('view=settings')) {
                    var container = document.getElementById('academy-root');
                    var loader = window.LawAIApp?.AcademyLoader;
                    if (container && loader) loader.renderSettings(container);
                    return;
                }
                if (window.location.search.includes('view=lesson')) {
                    var params = new URLSearchParams(window.location.search);
                    var lessonId = params.get('id') || params.get('lessonId');
                    if (lessonId) {
                        console.log('[Academy] 🎯 URL 请求 lesson:', lessonId);
                        window.location.href = '/pages/lesson.html?lessonId=' + encodeURIComponent(lessonId);
                        return;
                    }
                }

                try {
                    if (window.LawAIApp?.AcademyExperienceManager) {
                        if (!window.LawAIApp.AcademyExperienceManager.initialized) {
                            window.LawAIApp.AcademyExperienceManager.init();
                        }
                        window.LawAIApp.AcademyExperienceManager.render();
                    }
                } catch (e) {
                    console.warn('[Academy] Init error:', e);
                }
            }

            function waitForAcademyReady(attempts) {
                attempts = attempts || 0;
                var loader = window.LawAIApp?.AcademyLoader;

                if (loader && loader.status === 'ready') {
                    console.log('[Academy] ✅ AcademyLoader ready, initializing...');
                    initAcademy();
                    return;
                }

                if (attempts > 150) {
                    console.warn('[Academy] ⚠️ AcademyLoader timeout, trying init anyway...');
                    initAcademy();
                    return;
                }

                setTimeout(function() { waitForAcademyReady(attempts + 1); }, 100);
            }

            if (document.readyState === 'complete') {
                setTimeout(function() { waitForAcademyReady(); }, 100);
            } else {
                window.addEventListener('load', function() {
                    setTimeout(function() { waitForAcademyReady(); }, 100);
                });
            }

            console.log('✅ Academy page ready (Loader-based)');
        })();
    </script>
</body>
</html>
