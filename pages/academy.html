<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ Academy | Law AI</title>
    <link rel="stylesheet" href="/css/academy.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/animation.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/learning.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        body { margin: 0; background: #0b1220; color: #e2e8f0; font-family: 'Inter', -apple-system, sans-serif; }
        #academy-root { min-height: 100vh; max-width: 1200px; margin: 0 auto; padding-bottom: 80px; }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(20,20,40,0.92);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-around;
            padding: 6px 0 12px;
            z-index: 100;
        }
        .bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            color: #64748b;
            text-decoration: none;
            font-size: 9px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s;
            padding: 2px 12px;
        }
        .bottom-nav a:hover { color: #94a3b8; }
        .bottom-nav a.active { color: #4a9eff; }
        .bottom-nav a span:first-child { font-size: 18px; }
    </style>
</head>
<body>
    <div id="academy-root"></div>

    <nav class="bottom-nav">
        <a href="/" class="nav-item" data-tab="home">
            <span>🏠</span><span>Home</span>
        </a>
        <a href="/pages/academy.html" class="nav-item active" data-tab="academy">
            <span>📚</span><span>Academy</span>
        </a>
        <a href="#" class="nav-item" data-tab="calendar">
            <span>📅</span><span>Calendar</span>
        </a>
        <a href="#" class="nav-item" data-tab="notes">
            <span>📝</span><span>Notes</span>
        </a>
        <a href="#" class="nav-item" data-tab="settings">
            <span>⚙️</span><span>Settings</span>
        </a>
    </nav>

    <!-- ========================================================== -->
    <!-- 🔥 1. Runtime 核心                                         -->
    <!-- ========================================================== -->
    <script src="/js/storageEngine.js"></script>
    <script src="/js/eventBus.js"></script>
    <script src="/js/profileEngine.js"></script>
    <script src="/js/progressEngine.js"></script>
    <script src="/js/router.js"></script>
    <script src="/js/loader.js"></script>

    <!-- ========================================================== -->
    <!-- 🔥 2. Academy 所有文件 (按顺序加载)                        -->
    <!-- ========================================================== -->
    <script src="/js/academy/schoolRegistry.js"></script>
    <script src="/js/academy/programRegistry.js"></script>
    <script src="/js/academy/courseRegistry.js"></script>
    <script src="/js/academy/curriculumRegistry.js"></script>
    <script src="/js/academy/curriculumSeed.js"></script>
    <script src="/js/academy/academyView.js"></script>
    <script src="/js/academy/academyExperienceManager.js"></script>
    <script src="/js/academy/academyManifest.js"></script>
    <script src="/js/academy/academyLoader.js"></script>

    <!-- ========================================================== -->
    <!-- 🔥 3. 启动 Academy                                         -->
    <!-- ========================================================== -->
    <script>
        (function() {
            console.log('📄 Academy page loaded');

            // 底部导航
            document.querySelectorAll('.nav-item').forEach(function(item) {
                item.addEventListener('click', function(e) {
                    var tab = this.dataset.tab;
                    if (tab === 'home') {
                        window.location.href = '/';
                        return;
                    }
                    if (tab === 'academy') {
                        window.location.href = '/pages/academy.html';
                        return;
                    }
                    e.preventDefault();
                    var tabNames = {
                        'calendar': '📅 Calendar',
                        'notes': '📝 Notes',
                        'settings': '⚙️ Settings'
                    };
                    if (window.LawAIApp?.Toast && typeof LawAIApp.Toast.info === 'function') {
                        LawAIApp.Toast.info(tabNames[tab] + ' coming soon! 🚧');
                    } else {
                        alert(tabNames[tab] + ' coming soon! 🚧');
                    }
                });
            });

            // ============================================================
            // 🔥 4. 手动初始化 Academy (不依赖 AcademyLoader)
            // ============================================================
            function initAcademy() {
                console.log('🔥 Initializing Academy directly...');

                try {
                    // 1. SchoolRegistry
                    if (window.LawAIApp?.SchoolRegistry) {
                        if (!window.LawAIApp.SchoolRegistry.initialized) {
                            window.LawAIApp.SchoolRegistry.initialize();
                        }
                        console.log('✅ SchoolRegistry ready');
                    } else {
                        console.warn('⚠️ SchoolRegistry not found');
                    }

                    // 2. ProgramRegistry
                    if (window.LawAIApp?.ProgramRegistry) {
                        if (!window.LawAIApp.ProgramRegistry.initialized) {
                            window.LawAIApp.ProgramRegistry.initialize();
                        }
                        console.log('✅ ProgramRegistry ready');
                    } else {
                        console.warn('⚠️ ProgramRegistry not found');
                    }

                    // 3. CourseRegistry
                    if (window.LawAIApp?.CourseRegistry) {
                        if (!window.LawAIApp.CourseRegistry.initialized) {
                            window.LawAIApp.CourseRegistry.initialize();
                        }
                        console.log('✅ CourseRegistry ready');
                    } else {
                        console.warn('⚠️ CourseRegistry not found');
                    }

                    // 4. CurriculumSeed
                    if (window.LawAIApp?.CurriculumSeed) {
                        if (!window.LawAIApp.CurriculumSeed.loaded) {
                            window.LawAIApp.CurriculumSeed.load();
                        }
                        console.log('✅ CurriculumSeed ready');
                    } else {
                        console.warn('⚠️ CurriculumSeed not found');
                    }

                    // 5. AcademyExperienceManager
                    if (window.LawAIApp?.AcademyExperienceManager) {
                        if (!window.LawAIApp.AcademyExperienceManager.initialized) {
                            window.LawAIApp.AcademyExperienceManager.init();
                        }
                        window.LawAIApp.AcademyExperienceManager.render();
                        console.log('✅ Academy rendered!');
                    } else {
                        console.warn('⚠️ AcademyExperienceManager not found');
                        // 创建 fallback 内容
                        var root = document.getElementById('academy-root');
                        if (root) {
                            root.innerHTML = `
                                <div style="padding: 40px; text-align: center; color: #e2e8f0;">
                                    <h1>🏛️ Law AI Academy</h1>
                                    <p style="color: #94a3b8;">Loading Academy...</p>
                                    <div style="margin-top: 20px; color: #64748b; font-size: 13px;">
                                        <span>⏳ Please wait</span>
                                    </div>
                                </div>
                            `;
                        }
                    }

                    console.log('✅ Academy initialization complete');

                } catch (error) {
                    console.error('❌ Academy init error:', error);
                }
            }

            // ============================================================
            // 🔥 5. 等待 DOM 就绪后启动
            // ============================================================
            if (document.readyState === 'complete') {
                setTimeout(initAcademy, 300);
            } else {
                document.addEventListener('DOMContentLoaded', function() {
                    setTimeout(initAcademy, 300);
                });
            }

            // 后备：如果 2 秒后还没初始化，再试一次
            setTimeout(function() {
                if (!window.LawAIApp?.AcademyExperienceManager?.initialized) {
                    console.log('🔄 Retry Academy init...');
                    initAcademy();
                }
            }, 2000);

        })();
    </script>
</body>
</html>
