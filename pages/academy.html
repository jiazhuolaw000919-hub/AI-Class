        body { margin: 0; background: #0b1220; color: #e2e8f0; font-family: 'Inter', -apple-system, sans-serif; }

        #academy-root { padding-top: 0 !important; margin-top: 0 !important; min-height: 100vh; max-width: 1200px; margin: 0 auto; padding-bottom: 80px; }
        #academy-root > *:first-child { margin-top: 0 !important; padding-top: 0 !important; }
        #law-runtime-root { display: none !important; height: 0 !important; min-height: 0 !important; margin: 0 !important; padding: 0 !important; overflow: hidden !important; position: absolute !important; opacity: 0 !important; pointer-events: none !important; }
        body > *:not(#academy-root):not(.bottom-nav):not(style):not(script) { display: none !important; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20,20,40,0.92); backdrop-filter: blur(12px); border-top: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-around; padding: 6px 0 12px; z-index: 100; }
        .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 1px; color: #64748b; text-decoration: none; font-size: 9px; font-weight: 500; cursor: pointer; transition: color 0.2s; padding: 2px 12px; }
        .bottom-nav a:hover { color: #94a3b8; }
        .bottom-nav a.active { color: #4a9eff; }
        .bottom-nav a span:first-child { font-size: 18px; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

    <!-- Academy 启动脚本 (瘦身版)                                     -->
    <!-- ============================================================ -->
    <script>
        (function() {
            'use strict';

            console.log('📄 Academy page loaded (Part 164 - Slim)');

            var loader = window.LawAIApp?.AcademyLoader;
            if (!loader) {
                console.warn('[Academy] AcademyLoader not found');
                return;
            }

            // ============================================================
            // 导航点击
            // ============================================================
            document.querySelectorAll('.nav-item').forEach(function(item) {
                item.addEventListener('click', function(e) {
                    var tab = this.dataset.tab;

                    if (tab === 'home') {
                        window.location.href = '/';
                        return;
                    }
                    if (tab === 'academy') {
                        window.location.href = '/pages/academy.html';
                        return;
                    }

                    e.preventDefault();

                    var container = document.getElementById('academy-root');
                    if (!container) return;

                    if (tab === 'calendar') {
                        loader.renderCalendar(container, function() {
                            loader.updateNavHighlight('calendar');
                        });
                        return;
                    }

                    if (tab === 'settings') {
                        loader.renderSettings(container, function() {
                            loader.updateNavHighlight('settings');
                        });
                        return;
                    }

                    if (tab === 'notes') {
                        var event = new CustomEvent('NAVIGATE_TO_NOTES', {
                            detail: { source: 'bottom-nav' }
                        });
                        document.dispatchEvent(event);
                        return;
                    }
                });
            });

            // ============================================================
            // 事件监听器 (精简)
            // ============================================================

            // Calendar 导航
            document.addEventListener('NAVIGATE_TO_CALENDAR', function(e) {
                console.log('[Academy] 📅 NAVIGATE_TO_CALENDAR received');
                var container = document.getElementById('academy-root');
                if (container) {
                    loader.renderCalendar(container, function() {
                        loader.updateNavHighlight('calendar');
                    });
                }
            });

            // Settings 导航
            document.addEventListener('NAVIGATE_TO_SETTINGS', function(e) {
                console.log('[Academy] ⚙️ NAVIGATE_TO_SETTINGS received');
                var container = document.getElementById('academy-root');
                if (container) {
                    loader.renderSettings(container, function() {
                        loader.updateNavHighlight('settings');
                    });
                }
            });

            // Notes 导航
            document.addEventListener('NAVIGATE_TO_NOTES', function(e) {
                console.log('[Academy] 📝 NAVIGATE_TO_NOTES received');
                var container = document.getElementById('academy-root');
                if (!container) return;

                container.innerHTML = `
                    <div style="text-align:center;padding:60px;color:#94a3b8;">
                        <div style="font-size:48px;margin-bottom:16px;animation:pulse 2s ease-in-out infinite;">📝</div>
                        <p>Loading Notes...</p>
                    </div>
                `;

                if (loader.loadNotesAuthority) {
                    loader.loadNotesAuthority(function(auth) {
                        console.log('[Academy] ✅ NotesAuthority ready');
                        if (window.LawAIApp?.Notes?.render) {
                            window.LawAIApp.Notes._root = container;
                            window.LawAIApp.Notes.render();
                            loader.updateNavHighlight('notes');
                        } else {
                            var files = [
                                '/js/academy/knowledgeCapture.js',
                                '/js/academy/notes.js'
                            ];
                            var loaded = 0;
                            files.forEach(function(file) {
                                var script = document.createElement('script');
                                script.src = file + '?v=' + Date.now();
                                script.onload = function() {
                                    loaded++;
                                    if (loaded === files.length && window.LawAIApp?.Notes) {
                                        window.LawAIApp.Notes._root = container;
                                        window.LawAIApp.Notes.render();
                                        loader.updateNavHighlight('notes');
                                    }
                                };
                                script.onerror = function() { loaded++; };
                                document.head.appendChild(script);
                            });
                        }
                    }, function(error) {
                        console.warn('[Academy] ⚠️ NotesAuthority load failed:', error);
                        container.innerHTML = `
                            <div style="max-width:900px;margin:0 auto;padding:60px;text-align:center;color:#94a3b8;">
                                <div style="font-size:48px;margin-bottom:16px;">⚠️</div>
                                <h3 style="color:#e2e8f0;">Notes unavailable</h3>
                                <p style="margin:8px 0 16px;">Please try again later.</p>
                                <button onclick="window.location.href='/pages/academy.html'" style="
                                    padding:8px 20px;
                                    background:rgba(74,158,255,0.08);
                                    border:1px solid rgba(74,158,255,0.15);
                                    border-radius:100px;
                                    color:#4a9eff;
                                    cursor:pointer;
                                    font-family:inherit;
                                ">← Back to Academy</button>
                            </div>
                        `;
                    });
                } else {
                    // Fallback
                    var files = [
                        '/js/academy/knowledgeCapture.js',
                        '/js/academy/notes.js'
                    ];
                    var loaded = 0;
                    files.forEach(function(file) {
                        var script = document.createElement('script');
                        script.src = file + '?v=' + Date.now();
                        script.onload = function() {
                            loaded++;
                            if (loaded === files.length && window.LawAIApp?.Notes) {
                                window.LawAIApp.Notes._root = container;
                                window.LawAIApp.Notes.render();
                                loader.updateNavHighlight('notes');
                            }
                        };
                        script.onerror = function() { loaded++; };
                        document.head.appendChild(script);
                    });
                }
            });

            // CalendarAuthority 预加载
            document.addEventListener('NAVIGATE_TO_CALENDAR_AUTHORITY', function(e) {
                console.log('[Academy] 📅 NAVIGATE_TO_CALENDAR_AUTHORITY received');
                if (loader.loadCalendarAuthority) {
                    loader.loadCalendarAuthority(function(auth) {
                        console.log('[Academy] ✅ CalendarAuthority ready:', auth.getStatusSummary());
                        if (window.LawAIApp?.Toast?.success) {
                            LawAIApp.Toast.success('📅 Calendar ready');
                        }
                    }, function(error) {
                        console.warn('[Academy] ⚠️ CalendarAuthority load failed:', error);
                    });
                }
            });

            // NotesAuthority 预加载
            document.addEventListener('NAVIGATE_TO_NOTES_AUTHORITY', function(e) {
                console.log('[Academy] 📝 NAVIGATE_TO_NOTES_AUTHORITY received');
                if (loader.loadNotesAuthority) {
                    loader.loadNotesAuthority(function(auth) {
                        console.log('[Academy] ✅ NotesAuthority ready:', auth.getStatusSummary());
                        if (window.LawAIApp?.Toast?.success) {
                            LawAIApp.Toast.success('📝 Notes ready');
                        }
                    }, function(error) {
                        console.warn('[Academy] ⚠️ NotesAuthority load failed:', error);
                    });
                }
            });

            document.addEventListener('NAVIGATE_TO_SETTINGS', function(e) {
                console.log('[Academy] ⚙️ NAVIGATE_TO_SETTINGS received');
                var container = document.getElementById('academy-root');
                if (container && window.LawAIApp?.AcademyLoader?.renderSettings) {
                    window.LawAIApp.AcademyLoader.renderSettings(container, function() {
                        window.LawAIApp.AcademyLoader.updateNavHighlight('settings');
                    });
                }
            });

            // ============================================================
            // 初始化 Academy
            // ============================================================
            function initAcademy() {
                if (window.location.search.includes('view=calendar')) {
                    var container = document.getElementById('academy-root');
                    if (container) loader.renderCalendar(container);
                    return;
                }
                if (window.location.search.includes('view=settings')) {
                    var container = document.getElementById('academy-root');
                    if (container) loader.renderSettings(container);
                    return;
                }

                // 🔥 修复：处理 view=lesson 参数，跳转到 lesson.html
                if (window.location.search.includes('view=lesson')) {
                    var params = new URLSearchParams(window.location.search);
                    var lessonId = params.get('id') || params.get('lessonId');
                    if (lessonId) {
                        console.log('[Academy] 🎯 URL 请求 lesson:', lessonId);
                        window.location.href = '/pages/lesson.html?lessonId=' + encodeURIComponent(lessonId);
                        return;
                    }
                }

                try {
                    if (window.LawAIApp?.AcademyExperienceManager) {
                        if (!window.LawAIApp.AcademyExperienceManager.initialized) {
                            window.LawAIApp.AcademyExperienceManager.init();
                        }
                        window.LawAIApp.AcademyExperienceManager.render();
                    }
                } catch (e) {
                    console.warn('[Academy] Init error:', e);
                }
            }

            if (document.readyState === 'complete') {
                setTimeout(initAcademy, 200);
            } else {
                window.addEventListener('load', function() { setTimeout(initAcademy, 200); });
            }

            console.log('✅ Academy page ready (Part 164 - Slim)');

        })();

        // ============================================================
        // Part 174: S4 Content Bootstrap
        // ============================================================
        // 🔥 修复：把 HTML 注释 <!-- --> 改成 JS 注释 //，原来这里导致整个 script 解析失败
        (function() {
            'use strict';

            console.log('[Bootstrap] Starting S4 content bootstrap...');

            // 等待依赖就绪
            function waitForDeps(callback, attempts) {
                attempts = attempts || 0;

                var loader = window.LawAIApp?.ContentLoader;
                var cr = window.LawAIApp?.CourseRegistry;
                var sr = window.LawAIApp?.SubjectRegistry;
                var ca = window.LawAIApp?.CurriculumAuthority;

                if (loader && cr && sr && ca && cr.initialized && sr.initialized) {
                    callback();
                    return;
                }

                if (attempts >= 100) {
                    console.warn('[Bootstrap] Timeout waiting for deps');
                    return;
                }

                setTimeout(function() {
                    waitForDeps(callback, attempts + 1);
                }, 100);
            }

            // 手动加载 course-ai
            function bootstrapCourseAI() {
                console.log('[Bootstrap] Deps ready, loading course-ai...');

                var loader = window.LawAIApp.ContentLoader;
                var cr = window.LawAIApp.CourseRegistry;
                var sr = window.LawAIApp.SubjectRegistry;
                var ca = window.LawAIApp.CurriculumAuthority;

                if (!loader || typeof loader.loadCourse !== 'function') {
                    console.warn('[Bootstrap] ContentLoader missing loadCourse');
                    return;
                }

                loader.loadCourse('course-ai').then(function(course) {
                    if (!course) {
                        console.warn('[Bootstrap] course-ai not found');
                        return;
                    }

                    console.log('[Bootstrap] ✅ Loaded course-ai:', course.title);

                    // 注册到 CourseRegistry
                    if (!cr.getCourse('course-ai')) {
                        cr._courses.set('course-ai', {
                            id: course.id,
                            schoolId: course.schoolId,
                            programId: 'program-' + (course.schoolId || 'science'),
                            title: course.title,
                            description: course.description || '',
                            icon: course.icon,
                            estimatedHours: course.estimatedHours,
                            subjects: course.subjects || [],
                            status: course.status || 'published',
                            _s4: true
                        });
                        console.log('[Bootstrap] Registered to CourseRegistry');
                    }

                    // 加载 Subjects
                    var subjectIds = course.subjects || [];
                    var pending = subjectIds.length;

                    if (pending === 0) {
                        finishBootstrap();
                        return;
                    }

                    subjectIds.forEach(function(subjectId) {
                        loader.loadSubject(course.id, subjectId).then(function(subject) {
                            if (subject && !sr.getSubject(subject.id)) {
                                sr.register({
                                    id: subject.id,
                                    courseId: subject.courseId,
                                    title: subject.title,
                                    description: subject.description,
                                    lessons: subject.lessons || [],
                                    status: subject.status || 'published'
                                });
                                console.log('[Bootstrap] ✅ Registered subject:', subject.id);
                            }

                            pending--;
                            if (pending === 0) finishBootstrap();
                        }).catch(function(e) {
                            pending--;
                            if (pending === 0) finishBootstrap();
                        });
                    });
                });
            }

            function finishBootstrap() {
                console.log('[Bootstrap] ✅ All content loaded, re-ingesting...');

                var ca = window.LawAIApp.CurriculumAuthority;
                if (ca && typeof ca._ingestFromRegistries === 'function') {
                    ca._ingestFromRegistries();
                }

                // 触发渲染
                setTimeout(function() {
                    if (window.LawAIApp?.AcademyExperienceManager?.render) {
                        try {
                            window.LawAIApp.AcademyExperienceManager.render();
                        } catch (e) {}
                    }
                }, 200);
            }

            // 启动
            if (document.readyState === 'complete') {
                setTimeout(function() {
                    waitForDeps(bootstrapCourseAI);
                }, 500);
            } else {
                window.addEventListener('load', function() {
                    setTimeout(function() {
                        waitForDeps(bootstrapCourseAI);
                    }, 500);
                });
            }
        })();
    </script>
