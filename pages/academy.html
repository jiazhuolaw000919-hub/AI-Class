<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ Academy | Law AI</title>
    <link rel="stylesheet" href="/css/academy.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/animation.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/learning.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        /* ==========================================================
           Academy 页面样式
           ========================================================== */
        body { 
            margin: 0; 
            background: #0b1220; 
            color: #e2e8f0; 
            font-family: 'Inter', -apple-system, sans-serif; 
        }

        /* ==========================================================
           🔥 强制消除 Academy 页面顶部空白
           ========================================================== */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
        }

        #academy-root {
            padding-top: 0 !important;
            margin-top: 0 !important;
            min-height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 80px;
        }
        #academy-root > *:first-child {
            margin-top: 0 !important;
            padding-top: 0 !important;
        }

        /* 🔥 隐藏 Dashboard 根容器，消除顶部空白 */
        #law-runtime-root {
            display: none !important;
            height: 0 !important;
            min-height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            position: absolute !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* 🔥 隐藏任何非 Academy 的顶部元素 */
        body > *:not(#academy-root):not(.bottom-nav):not(style):not(script) {
            display: none !important;
        }

        /* ==========================================================
           底部导航
           ========================================================== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(20,20,40,0.92);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-around;
            padding: 6px 0 12px;
            z-index: 100;
        }
        .bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            color: #64748b;
            text-decoration: none;
            font-size: 9px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s;
            padding: 2px 12px;
        }
        .bottom-nav a:hover { color: #94a3b8; }
        .bottom-nav a.active { color: #4a9eff; }
        .bottom-nav a span:first-child { font-size: 18px; }
    </style>
</head>
<body>
    <!-- ========================================================== -->
    <!-- 🔥 Academy 容器                                          -->
    <!-- ========================================================== -->
    <div id="academy-root"></div>

    <!-- ========================================================== -->
    <!-- 底部导航                                                  -->
    <!-- ========================================================== -->
    <nav class="bottom-nav">
        <a href="/" class="nav-item" data-tab="home">
            <span>🏠</span><span>Home</span>
        </a>
        <a href="/pages/academy.html" class="nav-item active" data-tab="academy">
            <span>📚</span><span>Academy</span>
        </a>
        <a href="#" class="nav-item" data-tab="calendar">
            <span>📅</span><span>Calendar</span>
        </a>
        <a href="#" class="nav-item" data-tab="notes">
            <span>📝</span><span>Notes</span>
        </a>
        <a href="#" class="nav-item" data-tab="settings">
            <span>⚙️</span><span>Settings</span>
        </a>
    </nav>

    <!-- ========================================================== -->
    <!-- 脚本加载                                                  -->
    <!-- ========================================================== -->
    <script src="/js/storageEngine.js"></script>
    <script src="/js/eventBus.js"></script>
    <script src="/js/profileEngine.js"></script>
    <script src="/js/progressEngine.js"></script>
    <script src="/js/router.js"></script>
    <script src="/js/loader.js"></script>
    <script src="/js/academy/academyManifest.js"></script>
    <script src="/js/academy/academyLoader.js"></script>
    <script src="/js/academy/academyExperienceManager.js"></script>
    <script src="/js/academy/notesView.js"></script>
    <script src="/js/academy/academyView.js"></script>
    <script src="/js/academy/learningJourneyAdapter.js"></script>

    <script>
        (function() {
            'use strict';

            console.log('📄 Academy page loaded (v6.2.0)');

            // ============================================================
            // 🔥 检测目标视图（在一切之前执行）
            // ============================================================
            var targetView = 'dashboard';
            if (window.location.hash === '#notes' || window.location.search.includes('view=notes')) {
                targetView = 'notes';
                console.log('📝 Direct navigation to Notes detected (targetView = notes)');
            }

            // ============================================================
            // 🔥 覆盖 app.js 的 fallback 机制
            // ============================================================
            function overrideAppFallback() {
                if (window.App) {
                    if (window.App._state) {
                        window.App._state.mounted = true;
                        window.App._state.healthy = true;
                        window.App._state.booted = true;
                        window.App._state.initialized = true;
                    }
                
                    if (typeof window.App._scheduleFallbackCheck === 'function') {
                        window.App._scheduleFallbackCheck = function() {
                            console.log('[Academy] 🛡️ Fallback check blocked');
                            this._state.mounted = true;
                            this._state.healthy = true;
                            this._state.booted = true;
                        };
                    }
                
                    var event = new CustomEvent('COMPOSER_MOUNTED', {
                        detail: { version: 'academy', mounted: true }
                    });
                    window.dispatchEvent(event);
                    document.dispatchEvent(event);
                
                    console.log('[Academy] ✅ App fallback overridden');
                    return true;
                }
                return false;
            }

            if (!overrideAppFallback()) {
                var checkInterval = setInterval(function() {
                    if (overrideAppFallback()) {
                        clearInterval(checkInterval);
                    }
                }, 100);
                setTimeout(function() {
                    clearInterval(checkInterval);
                }, 3000);
            }

            // ============================================================
            // 🔥 底部导航
            // ============================================================
            document.querySelectorAll('.nav-item').forEach(function(item) {
                item.addEventListener('click', function(e) {
                    var tab = this.dataset.tab;
                    if (tab === 'home') {
                        window.location.href = '/';
                        return;
                    }
                    if (tab === 'academy') {
                        window.location.href = '/pages/academy.html';
                        return;
                    }
                    e.preventDefault();
                    
                    if (tab === 'notes') {
                        // 导航到 Notes 视图
                        if (window.LawAIApp?.AcademyExperienceManager) {
                            window.LawAIApp.AcademyExperienceManager.navigateToNotes();
                        } else {
                            window.location.hash = '#notes';
                            var event = new CustomEvent('NAVIGATE_TO_NOTES', {});
                            document.dispatchEvent(event);
                        }
                        return;
                    }

                    if (tab === 'calendar') {
                        showComingSoon('📅 Calendar');
                        return;
                    }

                    if (tab === 'settings') {
                        showComingSoon('⚙️ Settings');
                        return;
                    }

                    function showComingSoon(name) {
                        if (window.LawAIApp?.Toast && typeof window.LawAIApp.Toast.info === 'function') {
                            LawAIApp.Toast.info(name + ' coming soon! 🚧');
                        } else {
                            alert(name + ' coming soon! 🚧');
                        }
                    }
                });
            });

            // ============================================================
            // 🔥 唯一的  函数（合并所有逻辑）
            // ============================================================
            function initAcademy() {
                console.log('🔥 Initializing Academy, targetView:', targetView);

                try {
                    // 初始化 Registries
                    if (window.LawAIApp?.SchoolRegistry && !window.LawAIApp.SchoolRegistry.initialized) {
                        window.LawAIApp.SchoolRegistry.initialize();
                    }
                    if (window.LawAIApp?.ProgramRegistry && !window.LawAIApp.ProgramRegistry.initialized) {
                        window.LawAIApp.ProgramRegistry.initialize();
                    }
                    if (window.LawAIApp?.CourseRegistry && !window.LawAIApp.CourseRegistry.initialized) {
                        window.LawAIApp.CourseRegistry.initialize();
                    }
                    if (window.LawAIApp?.CurriculumSeed && !window.LawAIApp.CurriculumSeed.loaded) {
                        window.LawAIApp.CurriculumSeed.load();
                    }

                    // 🔥 初始化 AcademyExperienceManager 时传入 initialView
                    if (window.LawAIApp?.AcademyExperienceManager) {
                        if (!window.LawAIApp.AcademyExperienceManager.initialized) {
                            var initOptions = {};
                            if (targetView === 'notes') {
                                initOptions.initialView = 'notes';
                                console.log('📝 Passing initialView: notes to init()');
                            }
                            window.LawAIApp.AcademyExperienceManager.init(initOptions);
                        }
            
                        // 🔥 直接渲染（不需要再 navigateToNotes，因为状态已经设置好了）
                        window.LawAIApp.AcademyExperienceManager.render();
                        console.log('✅ Academy rendered, viewMode:', window.LawAIApp.AcademyExperienceManager._state.viewMode);
                    }
                } catch (error) {
                    console.error('❌ Academy init error:', error);
                }
            }
                    
            // ============================================================
            // 🔥 启动 Academy
            // ============================================================
            if (document.readyState === 'complete') {
                setTimeout(initAcademy, 200);
            } else {
                window.addEventListener('load', function() {
                    setTimeout(initAcademy, 200);
                });
            }

            console.log('✅ Academy page ready, targetView:', targetView);
        })();
    </script>
</body>
</html>
