    <script>
    // 🔥 诊断脚本：记录页面从头到尾发生的关键事件
    (function() {
        var t0 = performance.timing.navigationStart || Date.now();
        window.__DIAG__ = [];
        
        function log(event, extra) {
            var t = (performance.now ? performance.now() : Date.now() - t0).toFixed(0);
            var line = t + 'ms | ' + event + (extra ? ' | ' + JSON.stringify(extra) : '');
            window.__DIAG__.push(line);
            console.log('%c⏱️ ' + line, 'color:#f59e0b;font-weight:bold');
        }
        
        log('DIAG_START');
        
        // DOM 就绪
        document.addEventListener('DOMContentLoaded', function() {
            log('DOM_CONTENT_LOADED');
        });
        
        // window load
        window.addEventListener('load', function() {
            log('WINDOW_LOAD');
        });
        
        // 关键事件
        ['SYSTEM_READY', 'COMPOSER_MOUNTED', 'DASHBOARD_RENDERED', 'COMPOSER_HIDE_LOADER'].forEach(function(name) {
            document.addEventListener(name, function() {
                log(name);
            });
        });
        
        // 观察 #law-runtime-root 的 DOM 变化
        document.addEventListener('DOMContentLoaded', function() {
            var root = document.getElementById('law-runtime-root');
            if (!root) {
                log('NO_ROOT');
                return;
            }
            
            var mutationCount = 0;
            new MutationObserver(function(mutations) {
                mutationCount++;
                var detail = mutations.map(function(m) {
                    return m.type + ':' + (m.target.id || m.target.tagName);
                }).join(',');
                log('MUTATION#' + mutationCount, { target: detail, count: mutations.length });
            }).observe(root, { childList: true, subtree: true, attributes: true });
            
            log('OBSERVER_ATTACHED');
        });
        
        // 5 秒后输出完整时间线
        setTimeout(function() {
            console.log('%c════════════════════════════', 'color:red;font-weight:bold');
            console.log('%c📋 完整时间线：', 'color:red;font-weight:bold;font-size:14px');
            window.__DIAG__.forEach(function(line) {
                console.log('  ' + line);
            });
            console.log('%c════════════════════════════', 'color:red;font-weight:bold');
        }, 5000);
    })();

  <script>
  (function() {
      'use strict';

      console.log('🚀 Law AI Academy — Season 4');
      console.log('📋 Architecture: Learner Agency + Bounded Autonomy');
      console.log('🛠️ DevPanel: Ctrl+Shift+L');
      console.log('📊 Dashboard: S4 Integrated');

      var _loadingRemoved = false;

      // 🔥 从 DOM 里彻底移除遮罩
      function removeLoadingPlaceholder(reason) {
          if (_loadingRemoved) return;
          _loadingRemoved = true;

          var placeholder = document.getElementById('loading-placeholder');
          if (!placeholder) {
              console.log('ℹ️ Loading placeholder already gone (' + reason + ')');
              return;
          }

          // 双 rAF：确保 dashboard 已经 paint 到屏幕
          requestAnimationFrame(function() {
              requestAnimationFrame(function() {
                  // 🔥 直接 remove()，没有 transition、没有 visibility、没有 display 切换
                  placeholder.remove();
                  console.log('✅ Loading placeholder removed from DOM (' + reason + ')');
              });
          });
      }

      // 🔥 8 秒兜底：如果 dashboard 一直没渲染，也移除遮罩
      var fallbackTimer = setTimeout(function() {
          var root = document.getElementById('law-runtime-root');
          if (root && root.innerHTML.trim() === '') {
              console.warn('⚠️ Fallback: forcing Dashboard render');
              if (window.LawAIApp && window.LawAIApp.Dashboard && typeof window.LawAIApp.Dashboard.render === 'function') {
                  try { window.LawAIApp.Dashboard.render(); } catch (e) { console.warn(e); }
              }
          }
          removeLoadingPlaceholder('FALLBACK_8S');
      }, 8000);

      // 🔥 监听所有"该撤遮罩了"的信号
      document.addEventListener('SYSTEM_READY', function() {
          console.log('✅ SYSTEM_READY received');
          removeLoadingPlaceholder('SYSTEM_READY');
      });

      document.addEventListener('COMPOSER_MOUNTED', function() {
          console.log('✅ COMPOSER_MOUNTED received');
          removeLoadingPlaceholder('COMPOSER_MOUNTED');
      });

      document.addEventListener('DASHBOARD_RENDERED', function() {
          console.log('✅ DASHBOARD_RENDERED received');
          removeLoadingPlaceholder('DASHBOARD_RENDERED');
      });

      document.addEventListener('COMPOSER_HIDE_LOADER', function() {
          console.log('✅ COMPOSER_HIDE_LOADER received');
          removeLoadingPlaceholder('COMPOSER_HIDE_LOADER');
      });

      // 如果 DOM 已完全加载，手动触发
      if (document.readyState === 'complete') {
          setTimeout(function() {
              if (window.LawAIApp && window.LawAIApp.Bootstrap && typeof window.LawAIApp.Bootstrap.isBooted === 'function') {
                  if (!window.LawAIApp.Bootstrap.isBooted()) {
                      console.log('🔥 Manual boot trigger');
                      if (window.LawAIApp.BootManager && typeof window.LawAIApp.BootManager.start === 'function') {
                          window.LawAIApp.BootManager.start();
                      }
                  }
              }
          }, 500);
      }
  })();
  </script>

  <script>
  (function registerRealProviders() {
    var ai = window.LawAIApp && window.LawAIApp.AILayer;
    if (!ai || typeof ai.registerProvider !== 'function') {
      setTimeout(registerRealProviders, 300);
      return;
    }
  
    function makeProvider(id, name, defaultModel) {
      return {
        id: id,
        name: name,
        defaultModel: defaultModel,
  
        // 🔥 关键：用 execute，不是 call
        execute: async function(task, prompt, context) {
          var res = await fetch('/api/ai/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              provider: id,
              prompt: prompt,
              model: (context && context.model) || defaultModel,
              options: context || {}
            })
          });
  
          if (!res.ok) {
            var errData = null;
            try { errData = await res.json(); } catch (e) {}
            throw new Error((errData && errData.error) || (name + ' request failed (' + res.status + ')'));
          }
  
          var data = await res.json();
          return data;  // { text, provider, model, usage }
        }
      };
    }
  
    // 免费：Google Gemini
    ai.registerProvider('google', makeProvider('google', 'Google Gemini', 'gemini-3.6-flash'));
  
    // 免费额度：Groq
    ai.registerProvider('groq', makeProvider('groq', 'Groq', 'llama-3.1-70b-versatile'));
  
    // 付费（如果配了 key）
    ai.registerProvider('openai', makeProvider('openai', 'OpenAI', 'gpt-4o-mini'));
    ai.registerProvider('anthropic', makeProvider('anthropic', 'Anthropic', 'claude-3-5-haiku-20241022'));
    ai.registerProvider('deepseek', makeProvider('deepseek', 'DeepSeek', 'deepseek-chat'));
  
    // 默认改成 google（免费）
    if (typeof ai.setDefaultProvider === 'function') {
      ai.setDefaultProvider('google');
    }
  
    console.log('✅ Real providers registered: google, groq, openai, anthropic, deepseek');
  })();
  </script>
