      text-align: center;
      padding: 20px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9999;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }
    #loading-placeholder.hidden {
      opacity: 0;
      pointer-events: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {

  <!-- 启动脚本                                                     -->
  <!-- ============================================================ -->
  <script>
    (function() {
      'use strict';

      console.log('🚀 Law AI Academy — Season 4');
      console.log('📋 Architecture: Learner Agency + Bounded Autonomy');
      console.log('🛠️ DevPanel: Ctrl+Shift+L');
      console.log('📊 Dashboard: S4 Integrated');

      // 如果 8 秒后还没有内容，强制显示 Dashboard
      var fallbackTimer = setTimeout(function() {
        var root = document.getElementById('law-runtime-root');
        var placeholder = document.getElementById('loading-placeholder');

        if (root && root.innerHTML.trim() === '') {
          console.warn('⚠️ SYSTEM_READY timeout — forcing Dashboard render');

          if (window.LawAIApp?.Dashboard?.render) {
            window.LawAIApp.Dashboard.render();
          } else if (window.LawAIApp?.AcademyExperienceManager?.render) {
            window.LawAIApp.AcademyExperienceManager.render();
          }

          if (placeholder) {
            placeholder.classList.add('hidden');
          }
        }
      }, 8000);

      // SYSTEM_READY 触发时清除 fallback
      document.addEventListener('SYSTEM_READY', function() {
        clearTimeout(fallbackTimer);
        console.log('✅ SYSTEM_READY received');

        var placeholder = document.getElementById('loading-placeholder');
        if (placeholder) {
          setTimeout(function() {
            placeholder.classList.add('hidden');
          }, 400);
        }
      });

      // COMPOSER_MOUNTED 也是就绪信号
      document.addEventListener('COMPOSER_MOUNTED', function() {
        clearTimeout(fallbackTimer);
        console.log('✅ COMPOSER_MOUNTED received');

        var placeholder = document.getElementById('loading-placeholder');
        if (placeholder) {
          setTimeout(function() {
            placeholder.classList.add('hidden');
          }, 400);
        }
      });

      // 如果 DOM 已完全加载，手动触发
      if (document.readyState === 'complete') {
        setTimeout(function() {
          if (window.LawAIApp?.Bootstrap?.isBooted && !window.LawAIApp.Bootstrap.isBooted()) {
            console.log('🔥 Manual boot trigger');
            if (window.LawAIApp?.BootManager?.start) {
              window.LawAIApp.BootManager.start();
            }
          }
        }, 500);
      }

    })();
  </script>
